name: CD

on:
  push:
    branches:
      - 'release/*'

permissions:
  contents: read

env:
  RELEASE_BRANCH: ${{ github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate release branch and set build metadata
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "trees") | .version')
          test "$RELEASE_BRANCH" = "release/$version"
          {
            echo "RELEASE_TAG=v$version"
            echo "GIT_COMMIT_SHA=$(git rev-parse HEAD)"
            echo "GIT_DIRTY=false"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Test and build
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --all-targets --all-features
          cargo build --locked --release --target "$RELEASE_TARGET"

      - name: Generate third-party notices
        run: |
          cargo install cargo-about --version 0.9.0 --locked --features cli
          bash scripts/generate-third-party-notices.sh

      - name: Package release
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/package-release.sh "$RELEASE_TAG" "$RELEASE_TARGET"

      - uses: actions/upload-artifact@v7
        with:
          name: trees-${{ matrix.target }}
          path: target/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          release_tag="v${RELEASE_BRANCH#release/}"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            tag_commit=$(git rev-parse "refs/tags/$release_tag^{commit}")
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $release_tag already points to $tag_commit, expected $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: trees-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
            --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
