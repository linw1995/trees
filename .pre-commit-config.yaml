repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        args: ["--verbose", "--"]
      - id: clippy
        args: ["--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
      - id: cargo-check
        args: ["--workspace", "--all-targets", "--all-features"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: semantic-commit-message
        name: semantic commit message
        entry: python3 scripts/check_semantic_title.py
        language: system
        stages: [commit-msg]
      - id: rust-analyzer
        name: rust-analyzer
        entry: rust-analyzer diagnostics .
        language: system
        pass_filenames: false
        files: '^(Cargo\.toml|Cargo\.lock|src/.*\.rs|tests/.*\.rs)$'
      - id: third-party-notices
        name: third-party-notices
        entry: scripts/check-third-party-notices.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: runtime-sql-boundary
        name: runtime SQL boundary
        entry: bash scripts/check-runtime-sql.sh
        language: system
        pass_filenames: false
        files: ^src/.*\.rs$
      - id: harper
        name: harper
        entry: harper-cli lint --no-color --format compact --user-dict-path .harper-dictionary.txt
        language: system
        types: [markdown]

default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false
