[package]
name = "trees"
version = "0.1.0"
edition = "2021"
description = "Manage coding workspaces composed of Git worktrees."

[[bin]]
name = "trees"
path = "src/main.rs"

[dependencies]
diesel = { version = "2.3", features = ["sqlite"] }
diesel_migrations = "2.3"
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
