[package]
name = "trees"
version = "0.1.0"
edition = "2021"
description = "Manage coding workspaces composed of Git worktrees."
license = "Apache-2.0"

[[bin]]
name = "trees"
path = "src/main.rs"

# Keep release artifacts unstripped because Fenix's Darwin rust-objcopy can fail to resolve libLLVM.dylib during Cargo's post-link strip step.
[profile.release]
strip = "none"

[dependencies]
clap = { version = "4", features = ["derive"] }
diesel = { version = "2.3", features = ["sqlite"] }
diesel_migrations = "2.3"
fs2 = "0.4"
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["serde", "v7"] }
